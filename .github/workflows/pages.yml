# main → 사이트 루트(/), dev → /dev/
# 어느 브랜치에 푸시되든 두 브랜치의 최신 내용을 합쳐서 한 번에 배포한다.
name: Deploy Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 스모크 테스트 (푸시된 브랜치)
        run: |
          npm ci
          npm test

      - name: 사이트 조립 (main → /, dev → /dev/)
        run: |
          set -euo pipefail
          export_branch() {  # $1 = 브랜치, $2 = 대상 폴더
            if git ls-remote --exit-code --heads origin "$1" > /dev/null; then
              git fetch --depth=1 origin "$1"
              mkdir -p "$2"
              git archive FETCH_HEAD | tar -x -C "$2"
              rm -rf "$2/.github" "$2/tests" "$2/package.json" "$2/package-lock.json" "$2/.gitignore"
              echo "$1 → $2 ($(git rev-parse --short FETCH_HEAD))"
            else
              echo "$1 브랜치 없음, 건너뜀"
            fi
          }
          mkdir -p _site
          export_branch main _site
          export_branch dev _site/dev
          touch _site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
